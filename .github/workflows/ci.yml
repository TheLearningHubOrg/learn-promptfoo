name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match EXPOSE in the Dockerfile and the port the process listens on.
  APP_PORT: "8080"
  HEALTH_PATH: "/health"
  PROMPTFOO_DISABLE_TELEMETRY: "1"
  PROMPTFOO_DISABLE_UPDATE: "1"

jobs:
  test:
    name: Install, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # The offline promptfoo suite: the provider runs in-process, so no API keys are needed.
      - name: Promptfoo eval (in-process provider)
        if: matrix.node == 24
        run: npm run eval

  docker:
    name: Docker image builds and answers on APP_PORT
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: guide-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container
        run: |
          docker run -d --name app -p 8080:${APP_PORT} guide-app:ci
          for _ in $(seq 1 30); do
            if curl -fsS "http://localhost:8080${HEALTH_PATH}" > /dev/null; then
              echo "Container answered on port ${APP_PORT}"; exit 0
            fi
            sleep 2
          done
          docker logs app
          exit 1
      # The same promptfoo suite, now sent over HTTP to the running container.
      - name: Promptfoo eval against the container
        env:
          SUPPORT_BOT_URL: http://localhost:8080
        run: npm run eval:http
      - name: Container logs on failure
        if: failure()
        run: docker logs app
