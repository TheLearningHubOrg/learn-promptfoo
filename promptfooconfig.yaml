# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# Offline regression suite for the starter support bot.
# Run: npm run eval   (no API keys needed; the provider runs in-process)
description: Support bot regression suite

prompts:
  - '{{inquiry}}'

providers:
  - id: file://src/providers/support-bot.ts
    label: support-bot-local

defaultTest:
  vars:
    tier: free
  assert:
    - type: is-json
    - type: javascript
      value: file://src/assertions/ticket-schema.ts
      metric: schema
    - type: javascript
      value: file://src/assertions/no-leak.ts
      metric: safety
    - type: latency
      threshold: 500

tests: file://tests/cases/support.yaml
